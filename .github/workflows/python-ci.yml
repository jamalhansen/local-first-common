# Shared CI for every local-first fleet repo (added 2026-10-04).
#
# Mirrors the local pre-commit hook (install_hooks.py) so CI and the hook can't
# disagree: pinned ruff with SIM115 and B904 (raise-from inside except), ruff
# format --check (line length 120, set in each repo's pyproject.toml), uv.lock
# matching pyproject.toml, pytest with the 50% coverage floor. Adds the checks no
# commit-time hook can do well: pip-audit over the locked dependencies (new
# advisories appear without any commit, which is why callers also run weekly),
# gitleaks over the full git history, and pyright, which fails the run on any
# error (strict is the default since 2026-10-06, when the whole fleet reached zero;
# typecheck: report downgrades it to annotations for a repo mid-cleanup).
#
# Every check runs even if an earlier one failed, so one run is a complete report.
#
# Caller (in each repo, .github/workflows/ci.yml):
#   jobs:
#     ci:
#       uses: jamalhansen/local-first-common/.github/workflows/python-ci.yml@main
#       with:
#         siblings: "content-discovery-agent"   # only for repos with ../ path deps
#         typecheck: report                      # only while cleaning up a new repo
name: python-ci

on:
  workflow_call:
    inputs:
      siblings:
        description: "Space-separated fleet repos this one depends on by ../ path, cloned next to it"
        type: string
        default: ""
      coverage:
        description: "Minimum coverage percent (the pre-commit hook uses 50)"
        type: number
        default: 50
      python-version:
        type: string
        default: "3.12"
      typecheck:
        description: "strict (pyright errors fail the run) or report (annotations only, for a repo mid-cleanup)"
        type: string
        default: "strict"

permissions:
  contents: read

env:
  RUFF_PIN: "ruff==0.16.7"     # keep in step with RUFF_PIN in install_hooks.py
  # Typer forces colour output when GITHUB_ACTIONS is set, so CLI tests that check
  # --help text saw ANSI codes in CI only (blog-post-draft-reviewer, 2026-10-04).
  _TYPER_FORCE_DISABLE_TERMINAL: "1"
  GITLEAKS_VERSION: "8.30.1"
  PYRIGHT_PIN: "pyright==1.1.414"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer push to the same branch makes an in-flight run moot.
    concurrency:
      group: ${{ github.repository }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@v7
        with:
          path: repo
          fetch-depth: 0          # full history for the secrets scan

      - name: Clone sibling repos for ../ path dependencies
        if: inputs.siblings != ''
        working-directory: .
        run: |
          for s in ${{ inputs.siblings }}; do
            git clone --depth 1 "https://github.com/jamalhansen/${s}.git" "${s}"
          done

      - uses: astral-sh/setup-uv@v10.2.0   # no v10 major tag exists; pin exact
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: repo

      - name: uv.lock matches pyproject.toml
        id: lock
        run: uv lock --check

      - name: Install (from uv.lock, exactly)
        if: success() || failure()
        run: uv sync --frozen

      - name: Lint
        id: lint
        if: success() || failure()
        run: uv run --frozen --with "$RUFF_PIN" ruff check --extend-select SIM115,B904 .

      - name: Format
        id: format
        if: success() || failure()
        run: uv run --frozen --with "$RUFF_PIN" ruff format --check .

      - name: Tests
        id: tests
        if: success() || failure()
        # Each failing test also becomes an ::error annotation, so the failure is
        # readable on the run page and through the public API without opening
        # the logs (which need a login even on public repos).
        run: |
          set -o pipefail
          if [ ! -d tests ]; then echo "no tests/ directory"; exit 0; fi
          cov=""
          if [ -d src ]; then cov="--cov=src --cov-fail-under=${{ inputs.coverage }}"; fi
          # shellcheck disable=SC2086  # $cov is deliberately word-split
          # Actions runs this with `bash -e`: capture the status, or a failing
          # pytest exits the script before the annotations below are written.
          status=0
          uv run --frozen pytest -q -rfE --tb=short $cov 2>&1 | tee "$RUNNER_TEMP/pytest.log" || status=$?
          if [ $status -ne 0 ]; then
            grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/pytest.log" | head -20 | while IFS= read -r line; do
              echo "::error title=pytest::${line}"
            done
            grep -E '^FAIL Required test coverage' "$RUNNER_TEMP/pytest.log" | while IFS= read -r line; do
              echo "::error title=coverage::${line}"
            done
            # Whatever else went wrong (collection errors, crashes): the tail, as one annotation.
            tail_text=$(tail -n 15 "$RUNNER_TEMP/pytest.log" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=pytest output (last 15 lines)::${tail_text}"
          fi
          exit $status

      - name: Known vulnerabilities (pip-audit)
        id: audit
        if: success() || failure()
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-emit-workspace -q \
            | grep -E '^[A-Za-z0-9_.-]+==' > "$RUNNER_TEMP/requirements.txt" || true
          if [ ! -s "$RUNNER_TEMP/requirements.txt" ]; then echo "no third-party dependencies"; exit 0; fi
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

      - name: Secrets in git history (gitleaks)
        id: secrets
        if: success() || failure()
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact

      - name: Types (pyright)
        id: types
        if: success() || failure()
        # Runs inside the synced venv so imports resolve. Every error becomes an
        # annotation (first 50); only typecheck: strict lets them fail the run.
        run: |
          status=0
          uv run --frozen --with "$PYRIGHT_PIN" pyright --outputjson . > "$RUNNER_TEMP/pyright.json" || status=$?
          python3 - "$RUNNER_TEMP/pyright.json" "${{ inputs.typecheck }}" <<'PY'
          import json, os, sys
          report, mode = json.load(open(sys.argv[1])), sys.argv[2]
          errors = [d for d in report["generalDiagnostics"] if d["severity"] == "error"]
          level = "error" if mode == "strict" else "warning"
          for d in errors[:50]:
              path = os.path.relpath(d["file"])
              line = d["range"]["start"]["line"] + 1
              msg = d["message"].replace("%", "%25").replace("\n", "%0A")
              print(f"::{level} file={path},line={line},title=pyright {d.get('rule', '')}::{msg}")
          print(f"pyright: {len(errors)} errors ({mode} mode)")
          PY
          if [ "${{ inputs.typecheck }}" = "strict" ]; then exit $status; fi
