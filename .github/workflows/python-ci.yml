# Shared CI for every local-first fleet repo (added 2026-10-04).
#
# Mirrors the local pre-commit hook (install_hooks.py) so CI and the hook can't
# disagree: pinned ruff with SIM115, pytest with the 50% coverage floor. Adds the
# two checks no commit-time hook can do well: pip-audit over the locked
# dependencies (new advisories appear without any commit, which is why callers
# also run weekly) and gitleaks over the full git history.
#
# Every check runs even if an earlier one failed, so one run is a complete report.
#
# Caller (in each repo, .github/workflows/ci.yml):
#   jobs:
#     ci:
#       uses: jamalhansen/local-first-common/.github/workflows/python-ci.yml@main
#       with:
#         siblings: "content-discovery-agent"   # only for repos with ../ path deps
name: python-ci

on:
  workflow_call:
    inputs:
      siblings:
        description: "Space-separated fleet repos this one depends on by ../ path, cloned next to it"
        type: string
        default: ""
      coverage:
        description: "Minimum coverage percent (the pre-commit hook uses 50)"
        type: number
        default: 50
      python-version:
        type: string
        default: "3.12"

permissions:
  contents: read

env:
  RUFF_PIN: "ruff==0.16.7"     # keep in step with RUFF_PIN in install_hooks.py
  GITLEAKS_VERSION: "8.30.1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
          fetch-depth: 0          # full history for the secrets scan

      - name: Clone sibling repos for ../ path dependencies
        if: inputs.siblings != ''
        working-directory: .
        run: |
          for s in ${{ inputs.siblings }}; do
            git clone --depth 1 "https://github.com/jamalhansen/${s}.git" "${s}"
          done

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install (from uv.lock, exactly)
        run: uv sync --frozen

      - name: Lint
        id: lint
        run: uv run --frozen --with "$RUFF_PIN" ruff check --extend-select SIM115 .

      - name: Tests
        id: tests
        if: success() || failure()
        run: |
          if [ ! -d tests ]; then echo "no tests/ directory"; exit 0; fi
          if [ -d src ]; then
            uv run --frozen pytest -q --cov=src --cov-fail-under=${{ inputs.coverage }}
          else
            uv run --frozen pytest -q
          fi

      - name: Known vulnerabilities (pip-audit)
        id: audit
        if: success() || failure()
        run: |
          uv export --frozen --no-hashes --no-emit-project --no-emit-workspace -q \
            | grep -E '^[A-Za-z0-9_.-]+==' > "$RUNNER_TEMP/requirements.txt" || true
          if [ ! -s "$RUNNER_TEMP/requirements.txt" ]; then echo "no third-party dependencies"; exit 0; fi
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

      - name: Secrets in git history (gitleaks)
        id: secrets
        if: success() || failure()
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact
