[project]
name = "local-first-common"
version = "0.1.0"
description = "Shared library: LLM providers, Obsidian utilities, CLI helpers, and test mocks"
readme = "README.md"
authors = [
    { name = "Jamal Hansen", email = "jamal.hansen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "duckdb>=1.5.0",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "pydantic>=2.12.5",
    "python-frontmatter>=1.1.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "toml>=0.10.2",
    "typer>=0.24.1",
]

[project.scripts]
local-first = "local_first_common.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_first_common"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.84.0"]
groq = ["groq>=1.0.0"]
deepseek = ["openai>=2.24.0"]
gemini = ["google-genai>=1.65.0"]
pydantic-ai = ["pydantic-ai>=0.0.14"]
all-providers = ["anthropic>=0.84.0", "groq>=1.0.0", "openai>=2.24.0", "google-genai>=1.65.0", "pydantic-ai>=0.0.14"]
# Real-browser rendering for pages whose content is injected by client-side JS
# (e.g. x.com). Not part of a base install: it pulls a ~95MB browser binary via
# `playwright install chromium`. js_render.py imports playwright lazily, so a
# tool that never touches a JS-walled domain never pays this cost.
playwright = ["playwright>=1.40"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
markers = [
    "allow_network: test is permitted to make a real HTTP request",
]
